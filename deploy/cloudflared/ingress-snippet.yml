# Add this rule to the `ingress:` list of the tunnel that already serves
# *.2dee.org (above the final `- service: http_status:404` catch-all),
# then: sudo systemctl restart <that cloudflared service>
#
#   cloudflared tunnel route dns <tunnel-name> transfer.2dee.org
#
  - hostname: transfer.2dee.org
    service: http://127.0.0.1:4180
    originRequest:
      httpHostHeader: transfer.2dee.org
      connectTimeout: 10s
