<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>File download · 2dee transfer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <script type="module" src="/static/guest.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grain"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>2dee <b>transfer</b></span>
      </a>
    </header>

    <main class="stage">
      <section class="card" id="card" aria-live="polite">
        <div class="loading">Loading…</div>
      </section>

      <aside class="hero" aria-hidden="true">
        <p class="hero-kicker">Secure file transfer</p>
        <h1>A file has been<br />shared with you.</h1>
        <p class="hero-sub">Download it directly — no account needed.</p>
      </aside>
    </main>
  </body>
</html>
